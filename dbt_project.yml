name: 'tpch_demo'
version: '1.0.0'
config-version: 2

profile: 'DBTPRACTICEAI'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tpch_demo:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    incremental_strategies:
      +schema: incremental_demo
    truncate_and_load:
      +schema: truncate_demo

seeds:
  tpch_demo:
    +schema: seeds
    +quote_columns: false

# List of externally-loaded tables to truncate before an external reload step.
# Used by macros/truncate_all_tables.sql — see setup_scripts/04_create_external_load_tables.sql
# for what these tables are in this demo.
vars:
  tables_to_truncate:
    - tpch_demo.external_load.ext_customers
    - tpch_demo.external_load.ext_orders

# Project-level hooks — run once per `dbt run`/`dbt build` invocation,
# not per model. Good for session-wide setup/teardown (warehouse sizing,
# temp table cleanup, run-level logging).
on-run-start:
  - "insert into tpch_demo.raw.audit_log (model_name, event, event_at)
     select 'ALL_MODELS', 'dbt_run_started', current_timestamp()"
  # Uncomment to auto-truncate the external tables before every dbt run
  # (Option A from the guide). Left off by default so it doesn't run
  # unintentionally — prefer the on-demand run-operation (Option B) for demos.
  # - "{{ truncate_all_tables(var('tables_to_truncate')) }}"

on-run-end:
  - "insert into tpch_demo.raw.audit_log (model_name, event, event_at)
     select 'ALL_MODELS', 'dbt_run_completed', current_timestamp()"
